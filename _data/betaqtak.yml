# Copy for the Betaqtak site (/apps/betaqtak). Arabic is the default page; English mirrors it.
# Wording follows the app's Arabic rules (see the Betaqtak repo's CLAUDE.md): اضغط, حذف, صوّر,
# بصمة الوجه, iPhone in Latin script, بطاقة الرقم القومي. No em dashes.

# true links the App Store button; false shows "coming soon" instead.
live: true
appstore: "https://apps.apple.com/app/betaqtak/id6827935371"
accent: "#2F5BEA"
contact: "betaqtak@hesh.am"

# The watermark demo's two lines, Arabic first, as IDRender's Watermark writes them (purpose only).
watermark_ar: "صورة مقدمة لغرض إيجار شقة بتاريخ ٢٩ أكتوبر ٢٠٢٦. غير صالحة لأي غرض آخر"
watermark_en: "Copy provided for an apartment rental on 29 October 2026. Not valid for any other purpose."

