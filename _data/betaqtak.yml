  dir: rtl
  name: "بطاقتك"
  title: "بطاقتك: بطاقة الرقم القومي على iPhone"
  description: "احفظ بطاقة الرقم القومي لك ولعائلتك على iPhone، وانسخ رقمك القومي في ثوانٍ، وأرسل نسخة تُخفي ما لا يحتاجه المستلم وعليها علامة مائية."
  home: /apps/betaqtak/
  privacy: /apps/betaqtak/privacy
  other_lang_label: "English"
  other_lang_code: en
  other_home: /apps/betaqtak/en/
